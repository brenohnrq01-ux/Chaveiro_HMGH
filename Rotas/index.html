<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Configurações de PWA e Tema -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chaves">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <title>Controle de Chaves | Painel Admin</title>
  
  <!-- Fontes e Ícones externos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-body: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --warning-bg: #fef3c7;
      --warning-text: #b45309;
      --danger-bg: #fee2e2;
      --danger-text: #b91c1c;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; line-height: 1.5; overflow-x: hidden; }

    /* Login Box (Modal Overlay)  */
    .login-container {
      display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      padding: 30px 24px; border-radius: 16px; width: 100%; max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); text-align: center;
    }
    .login-card .logo-icon {
      background: var(--primary); color: white; width: 56px; height: 56px;
      border-radius: 14px; display: inline-flex; align-items: center;
      justify-content: center; font-size: 24px; margin-bottom: 20px;
    }

    /* Top Bar Header */
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.25rem; color: var(--text-main); }
    .brand i { color: var(--primary); font-size: 1.5rem; }
    .user-profile { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    /* Layout Principal */
    main { max-width: 1400px; margin: 24px auto; padding: 0 16px; }

    /* Banner Alerta de Atrasos */
    .alert-banner {
      background: var(--danger-bg); border: 1px solid #fca5a5; border-radius: var(--radius);
      padding: 16px; margin-bottom: 24px; display: none; color: var(--danger-text);
    }
    .alert-banner h4 { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1rem; margin-bottom: 8px; }
    .alert-list { list-style: none; padding-left: 20px; }
    .alert-list li { margin-top: 4px; font-size: 0.9rem; word-break: break-word; }

    /* Estatísticas do Dashboard */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface); padding: 16px; border-radius: var(--radius);
      border: 1px solid var(--border); display: flex; align-items: center; gap: 16px;
    }
    .stat-icon {
      width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0;
    }

    /* Grid de Setores e Cards de Chaves */
    .grid-sectors { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .sector-card {
      background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
      padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column;
    }
    .sector-title {
      font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border); display: flex;
      justify-content: space-between; align-items: center;
    }

    /* Lista de Chaves */
    .key-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .key-item {
      display: flex; justify-content: space-between; align-items: center; padding: 12px;
      background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; transition: all 0.2s; gap: 12px; flex-wrap: wrap;
    }
    .key-item:hover { border-color: #cbd5e1; background: #f1f5f9; }
    .key-info { flex: 1; min-width: 150px; }
    .key-info strong { font-size: 0.95rem; color: var(--text-main); }
    .key-info small { color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 2px; word-break: break-word; }

    /* Badges de Status */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem;
      font-weight: 600; text-transform: uppercase; margin-top: 4px;
    }
    .badge-guardada { background: var(--success-bg); color: var(--success-text); }
    .badge-emprestada { background: var(--warning-bg); color: var(--warning-text); }

    /* Botões Genéricos */
    .btn {
      padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.875rem; font-weight: 500; display: inline-flex; align-items: center;
      gap: 8px; transition: background 0.2s, transform 0.1s; white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: var(--text-main); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: var(--danger-bg); color: var(--danger-text); }
    .btn-danger:hover { background: #fca5a5; }

    /* Campos de Formulário */
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.875rem; color: var(--text-main); }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.95rem; transition: border-color 0.2s; background: #fff;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }

    /* Modal Genérica */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; z-index: 50; padding: 16px;
    }
    .modal-content {
      background: var(--surface); padding: 24px; border-radius: 16px;
      width: 440px; max-width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      max-height: 90vh; overflow-y: auto;
    }

    @media (max-width: 640px) {
      header {
        padding: 12px 16px;
        flex-direction: column;
        align-items: stretch;
      }
      .brand { justify-content: center; }
      .user-profile { justify-content: center; width: 100%; gap: 8px; }
      .user-profile .btn, .user-profile span { font-size: 0.85rem; }
      .stats-grid { grid-template-columns: 1fr; }
      .grid-sectors { grid-template-columns: 1fr; }
      .key-item { flex-direction: column; align-items: flex-start; }
      .key-item > div:last-child { width: 100%; display: flex; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <!-- Tela de Login -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <div class="logo-icon"><i class="fa-solid fa-key"></i></div>
      <h2 style="font-size: 1.5rem; margin-bottom: 8px;">Acesso ao Sistema</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 24px;">Entre com suas credenciais de operador</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label>E-mail Corporativo</label>
          <input type="email" id="loginEmail" required placeholder="admin@empresa.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="loginSenha" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
          Entrar no Painel
        </button>
      </form>
    </div>
  </div>

  <!-- Painel Principal -->
  <div id="mainDashboard" style="display: none;">
    <header>
      <div class="brand">
        <i class="fa-solid fa-key"></i>
        <span>Controle de Chaves</span>
      </div>
      <div class="user-profile">
        <button id="installBtn" class="btn btn-primary" style="display: none;" onclick="installPWA()">
          <i class="fa-solid fa-download"></i> Instalar App
        </button>
        <button class="btn btn-secondary" onclick="openReportModal()"><i class="fa-solid fa-file-csv"></i> Relatório</button>
        <span><i class="fa-regular fa-user"></i> <strong id="operatorName">Operador</strong></span>
        <button class="btn btn-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
      </div>
    </header>

    <main>
      <!-- Alerta de Chaves Atrasadas -->
      <div id="alertBanner" class="alert-banner">
        <h4><i class="fa-solid fa-triangle-exclamation"></i> Chaves em Atraso Identificadas</h4>
        <ul id="alertList" class="alert-list"></ul>
      </div>

      <!-- Resumo do Dashboard -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background: #e0e7ff; color: #4338ca;"><i class="fa-solid fa-vault"></i></div>
          <div>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Total de Setores</span>
            <h3 id="totalSectors">0</h3>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background: var(--success-bg); color: var(--success-text);"><i class="fa-solid fa-check"></i></div>
          <div>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Chaves Disponíveis</span>
            <h3 id="totalAvailable">0</h3>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background: var(--warning-bg); color: var(--warning-text);"><i class="fa-solid fa-hand-holding"></i></div>
          <div>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Chaves Emprestadas</span>
            <h3 id="totalBorrowed">0</h3>
          </div>
        </div>
      </div>

      <!-- Grid dos Setores e Chaves -->
      <div class="grid-sectors" id="sectorsContainer"></div>
    </main>
  </div>

  <!-- Modal para Registrar Empréstimo -->
  <div id="loanModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-hand-holding-hand"></i> Registrar Empréstimo</h3>
      <form id="loanForm">
        <input type="hidden" id="loanKeyId">
        <div class="form-group">
          <label>Chave Selecionada</label>
          <input type="text" id="loanKeyNum" readonly style="background: #f1f5f9; color: #64748b; font-weight: 600;">
        </div>
        <div class="form-group">
          <label>ID da Pessoa Autorizada</label>
          <input type="number" id="loanPersonId" required placeholder="Digite o ID cadastrado (ex: 1)">
        </div>
        <div class="form-group">
          <label>Previsão de Devolução</label>
          <input type="datetime-local" id="loanReturnDate" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Confirmar Saída</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para Relatório Mensal -->
  <div id="reportModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-file-lines"></i> Relatório Mensal</h3>
      <form id="reportForm">
        <div class="form-group">
          <label>Mês de Referência</label>
          <select id="reportMonth" required>
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ano</label>
          <input type="number" id="reportYear" required min="2020" max="2100">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" onclick="closeReportModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-download"></i> Baixar CSV</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Configurações do PWA e Lógica de Instalação por Botão
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('installBtn');
      if (installBtn) {
        installBtn.style.display = 'inline-flex';
      }
    });

    function installPWA() {
      const installBtn = document.getElementById('installBtn');
      if (!deferredPrompt) return;
      
      deferredPrompt.prompt();
      
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('Usuário aceitou a instalação do aplicativo.');
        } else {
          console.log('Usuário dispensou a instalação.');
        }
        deferredPrompt = null;
        if (installBtn) {
          installBtn.style.display = 'none';
        }
      });
    }

    // Registro do Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado:', reg.scope))
          .catch(err => console.log('Erro no Service Worker:', err));
      });
    }

    const API_URL = window.location.origin + '/api';

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('jwt_token');
      if (token) {
        showDashboard();
      }
    });

    // 1. AÇÃO DE LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const senha = document.getElementById('loginSenha').value;

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (jsonErr) {
          throw new Error(`Servidor retornou resposta inválida (${res.status}): ${text.substring(0, 100)}...`);
        }

        if (!res.ok) throw new Error(data.erro || 'Falha na autenticação');

        localStorage.setItem('jwt_token', data.token);
        localStorage.setItem('user_name', data.usuario.nome);
        localStorage.setItem('user_id', data.usuario.id);

        showDashboard();
      } catch (err) {
        alert(`Erro de Login: ${err.message}`);
      }
    });

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainDashboard').style.display = 'block';
      document.getElementById('operatorName').innerText = localStorage.getItem('user_name') || 'Operador';
      loadDashboard();
      checkOverdueKeys();
    }

    function logout() {
      localStorage.clear();
      window.location.reload();
    }

    function getAuthHeaders() {
      const token = localStorage.getItem('jwt_token');
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }

    // 2. CARREGAR DASHBOARD (com deduplicação de segurança de chaves)
    async function loadDashboard() {
      try {
        const res = await fetch(`${API_URL}/dashboard`, { headers: getAuthHeaders() });
        const data = await res.json();

        if (!res.ok) throw new Error(data.erro || 'Erro ao buscar dados');

        let totalAvailable = 0;
        let totalBorrowed = 0;

        // Filtro de segurança: Garante 1 único registro por chave_id
        const uniqueKeysMap = new Map();
        data.forEach(item => {
          if (item.chave_id && !uniqueKeysMap.has(item.chave_id)) {
            uniqueKeysMap.set(item.chave_id, item);
          }
        });

        const sectorsMap = {};
        Array.from(uniqueKeysMap.values()).forEach(item => {
          if (!sectorsMap[item.setor_nome]) {
            sectorsMap[item.setor_nome] = [];
          }
          sectorsMap[item.setor_nome].push(item);
          if (item.chave_status === 'guardada') totalAvailable++;
          if (item.chave_status === 'emprestada') totalBorrowed++;
        });

        document.getElementById('totalSectors').innerText = Object.keys(sectorsMap).length;
        document.getElementById('totalAvailable').innerText = totalAvailable;
        document.getElementById('totalBorrowed').innerText = totalBorrowed;

        // Ordena os nomes dos setores em ordem crescente
        const sortedSectorNames = Object.keys(sectorsMap).sort((a, b) => 
          a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
        );

        const container = document.getElementById('sectorsContainer');
        container.innerHTML = sortedSectorNames.map(sectorName => {
          // Ordena as chaves de cada setor pelo número identificador em ordem crescente (ex: CH-001, CH-002...)
          const sortedKeys = sectorsMap[sectorName].sort((a, b) => 
            (a.numero_identificador || '').localeCompare(b.numero_identificador || '', undefined, { numeric: true, sensitivity: 'base' })
          );

          return `
            <div class="sector-card">
              <div class="sector-title">
                <span><i class="fa-regular fa-folder-closed"></i> ${sectorName}</span>
                <small style="font-size: 0.75rem; color: var(--text-muted);">${sortedKeys.length} chave(s)</small>
              </div>
              <ul class="key-list">
                ${sortedKeys.map(key => `
                  <li class="key-item">
                    <div class="key-info">
                      <strong>${key.numero_identificador}</strong> -${key.nome_chave}
                      <div>
                        <span class="badge ${key.chave_status === 'guardada' ? 'badge-guardada' : 'badge-emprestada'}">
                          ${key.chave_status}
                        </span>
                      </div>
                      ${key.pessoa_com_chave ? `<small><i class="fa-regular fa-user"></i> Com: ${key.pessoa_com_chave}</small>` : ''}
                    </div>
                    <div>
                      ${key.chave_status === 'guardada' 
                        ? `<button class="btn btn-primary" onclick="openLoanModal(${key.chave_id}, '${key.numero_identificador}')"><i class="fa-solid fa-arrow-right-from-bracket"></i> Retirar</button>`
                        : `<button class="btn btn-secondary" onclick="returnKey(${key.emprestimo_id})"><i class="fa-solid fa-arrow-rotate-left"></i> Devolver</button>`
                      }
                    </div>
                  </li>
                `).join('')}
              </ul>
            </div>
          `;
        }).join('');

      } catch (err) {
        if (err.message.includes('Token') || err.message.includes('negado')) {
          logout();
        } else {
          alert(`Erro ao carregar o painel: ${err.message}`);
        }
      }
    }

    // 3. REGISTRAR EMPRÉSTIMO
    function openLoanModal(keyId, keyNum) {
      document.getElementById('loanKeyId').value = keyId;
      document.getElementById('loanKeyNum').value = keyNum;
      document.getElementById('loanModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('loanModal').style.display = 'none';
      document.getElementById('loanForm').reset();
    }

    document.getElementById('loanForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        chave_id: parseInt(document.getElementById('loanKeyId').value),
        pessoa_autorizada_id: parseInt(document.getElementById('loanPersonId').value),
        data_previsao_devolucao: document.getElementById('loanReturnDate').value,
        usuario_operador_id: parseInt(localStorage.getItem('user_id')) || 1
      };

      try {
        const res = await fetch(`${API_URL}/emprestimos`, {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Falha ao registrar empréstimo');

        alert('Empréstimo registrado com sucesso!');
        closeModal();
        loadDashboard();
        checkOverdueKeys();
      } catch (err) {
        alert(`Erro: ${err.message}`);
      }
    });

    // 4. REGISTRAR DEVOLUÇÃO
    async function returnKey(emprestimoId) {
      if (!confirm('Confirmar a devolução desta chave?')) return;

      try {
        const res = await fetch(`${API_URL}/emprestimos/${emprestimoId}/devolucao`, {
          method: 'POST',
          headers: getAuthHeaders()
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Falha ao devolver chave');

        alert('Chave devolvida com sucesso!');
        loadDashboard();
        checkOverdueKeys();
      } catch (err) {
        alert(`Erro: ${err.message}`);
      }
    }

    // 5. VERIFICAR ATRASOS (com deduplicação no banner)
    async function checkOverdueKeys() {
      try {
        const res = await fetch(`${API_URL}/emprestimos/atrasados`, { headers: getAuthHeaders() });
        const data = await res.json();

        const banner = document.getElementById('alertBanner');
        const list = document.getElementById('alertList');

        if (res.ok && data.length > 0) {
          // Filtra para manter apenas 1 entrada por identificador de chave
          const atraseUnique = Array.from(
            new Map(data.map(item => [item.numero_identificador, item])).values()
          );

          banner.style.display = 'block';
          list.innerHTML = atraseUnique.map(k => `
            <li><strong>${k.numero_identificador} (${k.nome_chave})</strong> com ${k.pessoa_nome} (Setor: ${k.pessoa_setor || 'N/A'})</li>
          `).join('');
        } else {
          banner.style.display = 'none';
        }
      } catch (err) {
        console.error('Erro ao verificar atrasos:', err);
      }
    }

    // 6. RELATÓRIO MENSAL (MODAL E DOWNLOAD DE CSV)
    function openReportModal() {
      const agora = new Date();
      const mesAtual = String(agora.getMonth() + 1).padStart(2, '0');
      document.getElementById('reportMonth').value = mesAtual;
      document.getElementById('reportYear').value = agora.getFullYear();
      document.getElementById('reportModal').style.display = 'flex';
    }

    function closeReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mes = document.getElementById('reportMonth').value;
      const ano = document.getElementById('reportYear').value;

      try {
        const res = await fetch(`${API_URL}/relatorios/mensal?mes=${mes}&ano=${ano}`, {
          headers: getAuthHeaders()
        });
        const result = await res.json();

        if (!res.ok) throw new Error(result.erro || 'Erro ao gerar relatório');

        if (!result.dados || result.dados.length === 0) {
          alert('Nenhum empréstimo registrado para este mês/ano.');
          return;
        }

        let csv = "Código Chave;Nome da Chave;Retirado por;setor;Dia Empréstimo;Horário;Devolução;Operador\n";
        
        result.dados.forEach(row => {
          csv += `"${row.numero_identificador}";"${row.nome_chave}";"${row.pessoa_nome}";"${row.pessoa_setor || ''}";"${row.dia_emprestimo}";"${row.hora_emprestimo}";"${row.data_devolucao || 'Pendente'}";"${row.operador_nome || 'N/I'}"\n`;
        });

        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Relatorio_Chaves_${result.mes}_${result.ano}.csv`;
        link.click();

        closeReportModal();
      } catch (err) {
        alert(`Erro ao gerar relatório: ${err.message}`);
      }
    });
  </script>
</body>
